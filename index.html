<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Platform Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #d1d5db;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #0b1220;
      color: #e5e7eb;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    .error {
      color: #f87171;
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 12px;
      text-align: center;
    }

    .dashboard {
      display: none;
      max-width: 900px;
      width: 100%;
      padding: 28px;
    }

    .dashboard h1 { text-align: left; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 20px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .card p {
      margin: 0;
      color: #9ca3af;
      font-size: 14px;
    }

    .logout {
      margin-top: 24px;
      width: auto;
      padding: 10px 18px;
      background: #374151;
    }

    .logout:hover { background: #4b5563; }
  </style>
</head>
<body>

  <!-- 登录界面 -->
  <div class="login-card" id="loginView">
    <h1>☁️ Cloud Platform</h1>
    <p class="subtitle">请使用 ID 和密码登录</p>

    <form id="loginForm">
      <label for="userId">ID / 用户名</label>
      <input id="userId" type="text" placeholder="请输入 ID" autocomplete="username" required />

      <label for="password">密码</label>
      <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required />

      <div class="error" id="errorMsg"></div>

      <button type="submit">登录</button>
    </form>
  </div>

  <!-- 登录后的控制台占位 -->
  <div class="dashboard" id="dashboardView">
    <h1>☁️ 云平台控制台</h1>
    <p style="color:#9ca3af;">欢迎回来，<span id="currentUser"></span></p>

    <div class="grid">
      <div class="card">
        <h3>🖥️ 云服务器</h3>
        <p>管理你的虚拟机实例。</p>
      </div>
      <div class="card">
        <h3>💾 对象存储</h3>
        <p>上传和管理文件。</p>
      </div>
      <div class="card">
        <h3>🗄️ 数据库</h3>
        <p>创建和管理数据库实例。</p>
      </div>
      <div class="card">
        <h3>📊 监控</h3>
        <p>查看资源使用情况。</p>
      </div>
    </div>

    <button class="logout" id="logoutBtn">退出登录</button>
  </div>

  <script>
    // ⚠️ 仅用于前端演示，真实项目必须由后端认证
    const DEMO_ID = "admin";
    const DEMO_PASSWORD = "123456";

    const loginView = document.getElementById("loginView");
    const dashboardView = document.getElementById("dashboardView");
    const loginForm = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const currentUser = document.getElementById("currentUser");
    const logoutBtn = document.getElementById("logoutBtn");

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const id = document.getElementById("userId").value.trim();
      const password = document.getElementById("password").value;

      if (id === DEMO_ID && password === DEMO_PASSWORD) {
        errorMsg.textContent = "";
        currentUser.textContent = id;
        loginView.style.display = "none";
        dashboardView.style.display = "block";
      } else {
        errorMsg.textContent = "ID 或密码错误，请重试。";
      }
    });

    logoutBtn.addEventListener("click", function () {
      dashboardView.style.display = "none";
      loginView.style.display = "block";
      loginForm.reset();
      errorMsg.textContent = "";
    });
  </script>
</body>
</html>
